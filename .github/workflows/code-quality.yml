name: Code Quality

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    # Skip on release commits pushed by the Prepare Release workflow, since it already ran these checks
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      # Takes less than eslint, so we run it first
      - name: Run Prettier check
        run: pnpm format:check

      # We also configured eslint-config-prettier to avoid conflicts
      - name: Run ESLint
        run: pnpm lint:check

      # Extra type checking for TypeScript, which is not covered by ESLint
      - name: Run TypeScript type check
        run: pnpm types:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    # Skip on release commits pushed by the Prepare Release workflow, since it already ran these checks
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Post coverage comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMENT=$(python3 .github/scripts/coverage_comment.py)
          gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT"
